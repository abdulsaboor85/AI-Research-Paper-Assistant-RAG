<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PaperInsight-AI( AI Research Assistant)</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
  
  <!-- ═══════════════════════════════════════════════════
       CSS FILE PATH - UPDATE THIS WITH YOUR CSS FILE PATH
       Example: ./styles/style.css or ../css/main.css
       ═══════════════════════════════════════════════════ -->
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <!-- MAIN APP CONTAINER -->
  <div class="app">
    
    <!-- ════════════════════════════════════════════════════
         SIDEBAR
         ════════════════════════════════════════════════════ -->
    <div class="sidebar">
      <!-- Sidebar Header with Logo -->
      <div class="sidebar-header">
        <div class="logo-mark">
          <svg viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
            <path d="M2 4 L2 12 Q2 14 4 14 L12 14 M4 2 L12 2 Q14 2 14 4 L14 10"/>
          </svg>
        </div>
        <div>
          <div class="logo-text">PaperMind</div>
          <div class="logo-sub">AI RESEARCH</div>
        </div>
        <button class="dark-btn" id="darkBtn" onclick="toggleDark()">🌙</button>
      </div>

      <!-- Upload Section -->
      <button class="upload-btn" onclick="document.getElementById('fileInput').click()">
        <svg viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
          <path d="M8 2 L8 10 M4 6 L8 2 L12 6"/>
        </svg>
        Upload Papers
      </button>
      
      <!-- Drop Zone -->
      <div class="drop-zone" id="dropZone">
        Drop PDFs here
      </div>
      <input type="file" id="fileInput" style="display:none" accept=".pdf" multiple />

      <!-- Papers List Section -->
      <div class="section-label">Your Papers</div>
      <div class="paper-list" id="paperList"></div>

      <!-- Sidebar Footer -->
      <div class="sidebar-footer">
        <button class="compare-btn" onclick="alert('Compare feature coming soon')">
          <svg viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
            <rect x="1" y="3" width="6" height="10" rx="1"/>
            <rect x="9" y="3" width="6" height="10" rx="1"/>
          </svg>
          Compare
        </button>
      </div>
    </div>

    <!-- ════════════════════════════════════════════════════
         MAIN CONTENT AREA
         ════════════════════════════════════════════════════ -->
    <div class="main">
      <!-- Tabs Navigation -->
      <div class="tabs-bar">
        <button class="tab active" id="tab-chat" onclick="switchTab('chat')">Chat</button>
        <button class="tab" id="tab-summary" onclick="switchTab('summary')">Summary</button>
        <button class="tab" id="tab-comparison" onclick="switchTab('comparison')">Comparison</button>
        <button class="tab" id="tab-insights" onclick="switchTab('insights')">Insights</button>
      </div>

      <!-- Tab Content -->
      <div class="tab-content">
        
        <!-- CHAT TAB -->
        <div id="panel-chat" class="tab-panel active">
          <div class="chat-container">
            <div class="chat-area" id="chatArea">
              <div class="thinking-msg" id="thinkingMsg" style="display:none">
                <div class="thinking-dot"></div>
                <div class="thinking-dot"></div>
                <div class="thinking-dot"></div>
              </div>
            </div>
            <div class="chat-input-wrapper">
              <textarea 
                id="chatInput" 
                class="chat-input" 
                placeholder="Ask about the papers..."
                onkeydown="handleKey(event)"
              ></textarea>
              <button class="send-btn" onclick="sendMessage()">Send</button>
            </div>
          </div>
        </div>

        <!-- SUMMARY TAB -->
        <div id="panel-summary" class="tab-panel">
          <div class="content-panel">
            <div class="section-title">Paper Summary</div>
            <div class="accordion" id="summaryAccordion"></div>
          </div>
        </div>

        <!-- COMPARISON TAB -->
        <div id="panel-comparison" class="tab-panel">
          <div class="content-panel">
            <div class="section-title">Paper Comparison</div>
            <div id="comparisonContent"></div>
          </div>
        </div>

        <!-- INSIGHTS TAB -->
        <div id="panel-insights" class="tab-panel">
          <div class="content-panel">
            <div class="section-title">Key Insights</div>
            <div id="insightsContent"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- ════════════════════════════════════════════════════
         PDF VIEWER PANEL
         ════════════════════════════════════════════════════ -->
    <div class="resize-handle" id="resizeHandle"></div>
    <div class="pdf-panel" id="pdfPanel">
      <div class="pdf-header">
        <h3 id="pdfTitle">Select a paper to view</h3>
        <button class="pdf-close" onclick="alert('Close feature can be implemented')">×</button>
      </div>
      <div class="pdf-body" id="pdfBody">
        <div class="pdf-placeholder" id="mainHighlight">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z"/>
          </svg>
          <p>Upload a paper to preview</p>
        </div>
      </div>
      <div class="pdf-footer">
        <button class="pdf-nav-btn" onclick="changePage(-1)">← Prev</button>
        <span class="page-info" id="pageInfo">0 / 0</span>
        <button class="pdf-nav-btn" onclick="changePage(1)">Next →</button>
      </div>
    </div>
  </div>

  <!-- Toast Container -->
  <div id="toastContainer" class="toast-container"></div>

  <!-- ═══════════════════════════════════════════════════
       JAVASCRIPT FILE PATH - UPDATE THIS WITH YOUR JS FILE PATH
       Example: ./scripts/app.js or ../js/main.js
       ═══════════════════════════════════════════════════ -->
  <script src="./script.js"></script>
</body>
</html>
